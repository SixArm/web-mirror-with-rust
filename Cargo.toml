[package]
name = "web-mirror"
version = "0.1.0"
edition = "2024"
# Edition 2024 needs Rust 1.85; the code also uses `Option::is_none_or` (1.82),
# `LazyLock` (1.80), and `File::set_modified` (1.75).
rust-version = "1.99"
description = "Mirror a website section to disk, like `wget --mirror`"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
license = "MIT OR Apache-2.0 OR GPL-2.0-only OR GPL-3.0-only OR BSD-3-Clause"
repository = "https://github.com/SixArm/web-mirror-with-rust"
readme = "README.md"
keywords = ["mirror", "crawler", "wget", "spider", "download"]
categories = ["command-line-utilities", "web-programming::http-client"]

[lib]
# src/types/ has illustrative (non-runnable) doc examples.
doctest = false

# Versions are the latest at the time of writing; `cargo update` moves within
# each caret range, and Dependabot (.github/dependabot.yml) proposes the rest.
[dependencies]
# Command line parsing (builder API, see src/app/clap.rs).
clap = "4.6.7"
# Configuration file loading (src/app/confy.rs), with serde for the Config struct.
confy = "2.0.0"
serde = { version = "1.0.229", features = ["derive"] }
# Logging.
env_logger = "0.11.11"
log = "0.4.35"
# Errors.
thiserror = "2.0.21"
# Async runtime: the crawl loop, timers, file writes.
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "fs",
    "io-util",
] }
# HTTP client (src/http/). Default features: rustls TLS with the system's
# certificate roots via rustls-platform-verifier, HTTP/2, charset decoding, and
# system proxy settings. Plus response decompression; decoded bodies are still
# capped by --max-file-size (src/http/read_body_with_limit.rs).
reqwest = { version = "0.13.5", features = [
    "gzip",
    "brotli",
    "deflate",
    "zstd",
] }
# HTML parsing and link discovery.
scraper = "0.29.0"
# URL parsing, resolving, and normalizing.
url = "2.5.8"
# Linear-time regexes: --follow-js heuristic, --accept-regex, --reject-regex.
regex = "1.13.1"
# Randomness for --wait-jitter.
fastrand = "2.5.0"
# HTTP dates for --timestamping (If-Modified-Since, Last-Modified).
httpdate = "1.0.3"